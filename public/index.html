<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notificações em Tempo Real</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 10px;
        }

        .status.connected {
            background: #10b981;
        }

        .status.disconnected {
            background: #ef4444;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .notifications-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .notification {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .notification.info {
            border-left-color: #3b82f6;
        }

        .notification.success {
            border-left-color: #10b981;
        }

        .notification.warning {
            border-left-color: #f59e0b;
        }

        .notification.error {
            border-left-color: #ef4444;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .notification-title {
            font-weight: 600;
            color: #1f2937;
            font-size: 16px;
        }

        .notification-time {
            color: #6b7280;
            font-size: 12px;
        }

        .notification-message {
            color: #4b5563;
            font-size: 14px;
            line-height: 1.5;
        }

        .notification-footer {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7280;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #6b7280;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📬 Sistema de Notificações</h1>
            <p>Notificações em Tempo Real com WebSocket</p>
            <div class="status disconnected" id="status">
                Desconectado
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalNotifications">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="infoCount">0</div>
                <div class="stat-label">Info</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successCount">0</div>
                <div class="stat-label">Sucesso</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="warningCount">0</div>
                <div class="stat-label">Avisos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="errorCount">0</div>
                <div class="stat-label">Erros</div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>✉️ Enviar Notificação</h2>
                <form id="notificationForm">
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="title" placeholder="Digite o título" required>
                    </div>
                    <div class="form-group">
                        <label>Mensagem</label>
                        <textarea id="message" placeholder="Digite a mensagem" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Tipo</label>
                        <select id="type">
                            <option value="info">Info</option>
                            <option value="success">Sucesso</option>
                            <option value="warning">Aviso</option>
                            <option value="error">Erro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sala</label>
                        <input type="text" id="room" value="global" placeholder="Nome da sala">
                    </div>
                    <button type="submit">Enviar Notificação</button>
                </form>
            </div>

            <div class="card">
                <h2>📋 Notificações Recebidas</h2>
                <div class="notifications-list" id="notificationsList">
                    <p style="text-align: center; color: #6b7280;">
                        Aguardando notificações...
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let notificationsCount = {
            total: 0,
            info: 0,
            success: 0,
            warning: 0,
            error: 0
        };

        // Conexão estabelecida
        socket.on('connect', () => {
            document.getElementById('status').textContent = 'Conectado';
            document.getElementById('status').className = 'status connected';
            
            // Registrar usuário
            socket.emit('register', {
                userId: `user_${Date.now()}`
            });
        });

        // Desconectado
        socket.on('disconnect', () => {
            document.getElementById('status').textContent = 'Desconectado';
            document.getElementById('status').className = 'status disconnected';
        });

        // Registrado com sucesso
        socket.on('registered', (data) => {
            console.log('Registrado:', data);
        });

        // Nova notificação recebida
        socket.on('notification', (notification) => {
            addNotification(notification);
            updateStats(notification.type);
        });

        // Formulário de envio
        document.getElementById('notificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                title: document.getElementById('title').value,
                message: document.getElementById('message').value,
                type: document.getElementById('type').value,
                room: document.getElementById('room').value
            };

            try {
                const response = await fetch('/api/notify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('notificationForm').reset();
                    document.getElementById('room').value = 'global';
                }
            } catch (error) {
                console.error('Erro ao enviar notificação:', error);
            }
        });

        function addNotification(notification) {
            const list = document.getElementById('notificationsList');
            
            // Remover mensagem de "aguardando"
            if (list.children.length === 1 && list.children[0].tagName === 'P') {
                list.innerHTML = '';
            }

            const notifElement = document.createElement('div');
            notifElement.className = `notification ${notification.type}`;
            
            const time = new Date(notification.timestamp).toLocaleTimeString('pt-BR');
            
            notifElement.innerHTML = `
                <div class="notification-header">
                    <div class="notification-title">${notification.title}</div>
                    <div class="notification-time">${time}</div>
                </div>
                <div class="notification-message">${notification.message}</div>
                <div class="notification-footer">
                    <span>Sala: ${notification.room}</span>
                    <span>De: ${notification.sender}</span>
                </div>
            `;

            list.insertBefore(notifElement, list.firstChild);

            // Limitar a 50 notificações na tela
            if (list.children.length > 50) {
                list.removeChild(list.lastChild);
            }
        }

        function updateStats(type) {
            notificationsCount.total++;
            notificationsCount[type]++;

            document.getElementById('totalNotifications').textContent = notificationsCount.total;
            document.getElementById('infoCount').textContent = notificationsCount.info;
            document.getElementById('successCount').textContent = notificationsCount.success;
            document.getElementById('warningCount').textContent = notificationsCount.warning;
            document.getElementById('errorCount').textContent = notificationsCount.error;
        }
    </script>
</body>
</html>
